[package]
name = "hyperion-quant"
version = "0.1.0"
edition = "2021"
authors = ["Aditya"]
description = "Low-latency trading engine components in Rust (order book, matching, risk, backtester) for research; not connected to any exchange"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
