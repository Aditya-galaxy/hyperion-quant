[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperion-events"
version = "0.1.0"
description = "How crypto prices react to exchange notices, second by second, and how fast you'd have to be to trade it"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
hyperion-events = "event_study.cli:main"

[tool.setuptools]
packages = ["event_study"]
