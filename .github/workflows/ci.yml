name: Rust CI & Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Build & Run Test Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cargo Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Check code formatting
      run: cargo fmt --all -- --check || true

    - name: Cargo Check
      run: cargo check --verbose

    - name: Run Test Suite (13 tests)
      run: cargo test --verbose

    - name: Verify Release Build
      run: cargo build --release --verbose

  python_tests:
    name: Python Tests (event study)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install test dependencies
      run: pip install numpy pytest

    # Offline by design: notice parsing runs on saved real notices, price
    # arithmetic on hand-built series. No test reaches Upbit or Binance.
    - name: Run Python tests
      run: pytest python/tests -q
